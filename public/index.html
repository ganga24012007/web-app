
<!DOCTYPE html>
<html lang="en" ng-app="studentApp">
<head>
    <meta charset="UTF-8">
    <title>Student Management</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>

<body ng-controller="StudentController">

    <h2>Student Management System</h2>

    <form ng-submit="saveStudent()">
        <input ng-model="form.name" placeholder="Name" required>
        <input ng-model="form.studentId" placeholder="Student ID" required>
        <input ng-model="form.dept" placeholder="Department" required>

        <button type="submit">
            {{form._id ? 'Update Student' : 'Add Student'}}
        </button>
    </form>

    <hr>

    <input ng-model="search" ng-change="loadStudents()"
           placeholder="Search students">

    <h3>Student List</h3>

    <table border="1" cellpadding="8">
        <tr>
            <th>Name</th>
            <th>Student ID</th>
            <th>Department</th>
            <th>Actions</th>
        </tr>

        <tr ng-repeat="s in students track by s._id">
            <td>{{s.name}}</td>
            <td>{{s.studentId}}</td>
            <td>{{s.dept}}</td>
            <td>
                <button ng-click="editStudent(s)">Edit</button>
                <button ng-click="deleteStudent(s._id)">Delete</button>
            </td>
        </tr>

        <tr ng-if="students.length == 0">
            <td colspan="4">No students found</td>
        </tr>
    </table>

    <p>{{message}}</p>

    <script>
        var app = angular.module("studentApp", []);

        app.controller("StudentController", function($scope, $http) {

            var API = "/api/students";

            $scope.students = [];
            $scope.form = {};
            $scope.search = "";

            // View and search students
            $scope.loadStudents = function() {
                $http.get(API, {params: {search: $scope.search}})
                .then(function(res) {
                    $scope.students = res.data;
                });
            };

            // Add or update student
            $scope.saveStudent = function() {
                var request;

                if ($scope.form._id) {
                    request = $http.put(API + "/" + $scope.form._id, $scope.form);
                } else {
                    request = $http.post(API, $scope.form);
                }

                request.then(function() {
                    $scope.message = "Saved successfully";
                    $scope.form = {};
                    $scope.loadStudents();
                });
            };

            // Select student for editing
            $scope.editStudent = function(s) {
                $scope.form = angular.copy(s);
            };

            // Delete student
            $scope.deleteStudent = function(id) {
                if (confirm("Delete student?")) {
                    $http.delete(API + "/" + id)
                    .then(function() {
                        $scope.message = "Deleted successfully";
                        $scope.loadStudents();
                    });
                }
            };

            $scope.loadStudents();
        });
    </script>

</body>
</html>
